services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zak}
      POSTGRES_DB: nomorewaste
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nomorewaste"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      PORT: "8086"
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-zak}@db:5432/nomorewaste?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8088}
      RAPPEL_JOURS: ${RAPPEL_JOURS:-30}
      SCHEDULER_INTERVALLE: ${SCHEDULER_INTERVALLE:-24h}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8087:8086"

  php:
    image: php:8.3-fpm
    environment:
      API_URL: http://api:8086
    volumes:
      - ./web:/var/www/html:ro
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/var/www/html:ro
    ports:
      - "8088:80"
    depends_on:
      - php

volumes:
  db_data:

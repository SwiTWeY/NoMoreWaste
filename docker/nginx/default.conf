server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Fichiers statiques (CSS, polices, images) servis directement par Nginx
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Reecriture d'URL : toute route inconnue passe par le front controller
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Execution PHP deleguee a php-fpm
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;
    }

    # Pages d'erreur personnalisees
    error_page 404 /erreur-404.html;
    error_page 500 502 503 504 /erreur-50x.html;
    location = /erreur-404.html { internal; }
    location = /erreur-50x.html { internal; }

    # Empeche l'acces aux fichiers sensibles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
